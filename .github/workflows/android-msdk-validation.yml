name: Android MSDK Validation

on:
  push:
    branches:
      - main
      - agent/android-msdk-v5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-msdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-msdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/fh2-rc-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure optional DJI MSDK app key
        shell: bash
        env:
          DJI_MSDK_APP_KEY: ${{ secrets.DJI_MSDK_APP_KEY }}
        run: |
          mkdir -p ~/.gradle
          if [ -n "$DJI_MSDK_APP_KEY" ]; then
            printf 'AIRCRAFT_API_KEY=%s\n' "$DJI_MSDK_APP_KEY" >> ~/.gradle/gradle.properties
            echo "DJI_APP_KEY_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "DJI_APP_KEY_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify packaged DJI runtime classes
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -f "$APK"
          test -x "$APKANALYZER"
          "$APKANALYZER" dex packages --defined-only "$APK" > /tmp/fh2-dex-packages.txt
          grep -F "dji.sdk.keyvalue.value.common.ComponentIndexType" /tmp/fh2-dex-packages.txt
          grep -F "dji.v5.manager.SDKManager" /tmp/fh2-dex-packages.txt
          grep -F "dji.sdk.keyvalue.key.CameraKey" /tmp/fh2-dex-packages.txt

      - name: Lint debug
        run: |
          gradle :app:lintDebug --stacktrace --no-daemon

      - name: Package hardware-test APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p app/build/fh2-artifact
          cp "$APK" app/build/fh2-artifact/fh2-rc-bridge-debug.apk
          printf '%s  %s\n' "$SHA256" "fh2-rc-bridge-debug.apk"             > app/build/fh2-artifact/fh2-rc-bridge-debug.apk.sha256

          cat > app/build/fh2-artifact/BUILD_INFO.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          msdk=5.18.0
          application_id=com.fh2.rcbridge
          dji_app_key_configured=${DJI_APP_KEY_CONFIGURED}
          sha256=${SHA256}
          EOF

      - name: Upload RC Bridge debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fh2-rc-bridge-debug-${{ github.sha }}
          path: android/fh2-rc-bridge/app/build/fh2-artifact/
          if-no-files-found: error
          retention-days: 14


  node-msdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: MSDK bridge tests
        run: |
          node --test \
            apps/control-api/dist/msdk-bridge.test.js \
            apps/control-api/dist/msdk-control.test.js \
            apps/control-api/dist/msdk-normalizer.test.js \
            apps/control-api/dist/msdk-token-revocations.test.js

      - name: MSDK media lifecycle source contract
        run: npm run test:msdk-media-lifecycle

      - name: MSDK control dead-man source contract
        run: npm run test:msdk-control-deadman

      - name: MSDK hardware evidence validator tests
        run: npm run test:msdk-evidence
