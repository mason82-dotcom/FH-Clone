name: Android MSDK Validation

on:
  push:
    branches:
      - agent/android-msdk-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-msdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/fh2-rc-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Lint debug
        run: |
          gradle :app:lintDebug --stacktrace --no-daemon
