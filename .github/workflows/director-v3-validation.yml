name: Direktor V3 Validierung

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      r1_bootstrap:
        description: "R1: package-lock mit npm 11.19.1 erzeugen und vollständig validieren"
        type: boolean
        required: false
        default: false
      hardware_scope:
        description: "Hardware-Evidence: main oder zusätzlich alle Draft-Gates"
        type: choice
        required: true
        default: main
        options:
          - main
          - all
      analyze_drafts:
        description: "Aktive Post-Release-Drafts gegen aktuellen main analysieren"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: director-v3-validation
  cancel-in-progress: false

jobs:
  r1-bootstrap:
    name: R1 Lockfile Bootstrap
    if: ${{ inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22.23.2 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: npm 11.19.1 einrichten
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --no-audit --no-fund
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "11.19.1"
          npm ping

      - name: Root-Lockfile erzeugen
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Clean npm ci
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Erfolgreichen Lockfile als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: fh2-r1-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  release-struktur:
    name: V3 Release-Struktur
    if: ${{ !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Verbindliche V3-Artefakte prüfen
        shell: bash
        run: |
          set -euo pipefail

          test -f package-lock.json || {
            echo "::error::package-lock.json fehlt. Gate 1 ist nicht reproduzierbar."
            exit 1
          }

          test -f .env.example || {
            echo "::error::.env.example im Repository-Root fehlt."
            exit 1
          }

          if [ -f compose.yaml ]; then
            echo "COMPOSE_FILE=compose.yaml" >> "$GITHUB_ENV"
          elif [ -f docker-compose.yml ]; then
            echo "COMPOSE_FILE=docker-compose.yml" >> "$GITHUB_ENV"
          else
            echo "::error::Root-Compose fehlt."
            exit 1
          fi

      - name: V3 Pflichtdienste im Compose prüfen
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f "$COMPOSE_FILE" --env-file .env config >/tmp/fh2-compose.yml
          services="$(docker compose -f "$COMPOSE_FILE" --env-file .env config --services)"

          for service in control-api emqx web; do
            echo "$services" | grep -Fx "$service" >/dev/null || {
              echo "::error::Pflichtdienst '$service' fehlt im Root-Compose."
              exit 1
            }
          done

          if ! echo "$services" | grep -Ex 'postgres|timescaledb' >/dev/null; then
            echo "::error::Persistenzdienst 'postgres' oder 'timescaledb' fehlt im Root-Compose."
            exit 1
          fi

  node:
    name: Node / TypeScript / Tests
    if: ${{ !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22.23.2 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: npm 11.19.1 einrichten
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --no-audit --no-fund
          test "$(npm --version)" = "11.19.1"

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  ugcs:
    name: UgCS-Bridge
    if: ${{ !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: UgCS-Bridge bauen
        working-directory: services/ugcs-bridge
        run: mvn -B -DskipTests package

  timescale:
    name: TimescaleDB / Migrationen
    if: ${{ !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Compose-Konfiguration prüfen
        working-directory: infra/timescale
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env config

      - name: TimescaleDB starten und Migrationen anwenden
        working-directory: infra/timescale
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env up -d

          for attempt in $(seq 1 45); do
            schema_ready="$(docker compose --env-file .env exec -T timescaledb               psql -U fhclone -d fhclone -tAc               "SELECT CASE WHEN
                 to_regclass('public.missions') IS NOT NULL
                 AND to_regclass('public.authz_audit') IS NOT NULL
                 AND to_regclass('public.gateway_credentials') IS NOT NULL
                 AND to_regclass('public.dji_gateways') IS NOT NULL
                 AND to_regclass('public.dji_gateway_devices') IS NOT NULL
               THEN 1 ELSE 0 END" 2>/dev/null || true)"
            if [ "$(printf '%s' "$schema_ready" | tr -d '[:space:]')" = "1" ]; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose --env-file .env logs
              exit 1
            fi
            sleep 2
          done

          docker compose --env-file .env exec -T timescaledb             psql -U fhclone -d fhclone -v ON_ERROR_STOP=1             -c "SELECT 1 FROM missions LIMIT 1;" >/dev/null

          docker compose --env-file .env exec -T timescaledb             psql -U fhclone -d fhclone -v ON_ERROR_STOP=1             -c "SELECT 1 FROM authz_audit LIMIT 1;" >/dev/null

          docker compose --env-file .env exec -T timescaledb \
            psql -U fhclone -d fhclone -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM gateway_credentials LIMIT 1;" >/dev/null

          docker compose --env-file .env exec -T timescaledb \
            psql -U fhclone -d fhclone -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM dji_gateways LIMIT 1;" >/dev/null

          docker compose --env-file .env exec -T timescaledb \
            psql -U fhclone -d fhclone -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM dji_gateway_devices LIMIT 1;" >/dev/null

      - name: TimescaleDB-Logs bei Fehlern
        if: failure()
        working-directory: infra/timescale
        run: docker compose --env-file .env logs || true

      - name: TimescaleDB stoppen
        if: always()
        working-directory: infra/timescale
        run: docker compose --env-file .env down -v || true

  runtime:
    name: Root Compose / Runtime Verify
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: CI-Runtime-Konfiguration erzeugen
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^FH2_API_BIND=.*/FH2_API_BIND=127.0.0.1/' .env
          sed -i 's/^FH2_WEB_BIND=.*/FH2_WEB_BIND=127.0.0.1/' .env
          sed -i 's/^MQTT_BIND=.*/MQTT_BIND=127.0.0.1/' .env
          sed -i 's/^EMQX_NODE_COOKIE=.*/EMQX_NODE_COOKIE=ci-emqx-node-cookie-A7-safe/' .env
          sed -i 's/^TIMESCALE_PASSWORD=.*/TIMESCALE_PASSWORD=ci-timescale-A7-safe/' .env
          sed -i 's/^MQTT_BACKEND_PASSWORD=.*/MQTT_BACKEND_PASSWORD=ci-backend-A7-safe/' .env
          sed -i 's/^EMQX_AUTHN_TOKEN=.*/EMQX_AUTHN_TOKEN=ci-authn-A7-safe/' .env
          sed -i 's/^EMQX_AUTHZ_TOKEN=.*/EMQX_AUTHZ_TOKEN=ci-authz-A7-safe/' .env
          ! grep -Eq '=(change-me|change-me-)' .env

      - name: Vollständige Root-Runtime verifizieren
        run: ./scripts/verify.sh

      - name: Runtime-Logs bei Fehlern
        if: failure()
        run: docker compose --env-file .env logs --no-color || true

      - name: Runtime abbauen
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans || true

  dokumentation:
    name: Deutsche V3-Dokumentation
    if: ${{ !inputs.r1_bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pflichtdokumente prüfen
        shell: bash
        run: |
          set -euo pipefail
          for file in             README.md             docs/README.md             docs/V3_ARCHITECTURE.md             docs/ARCHITECTURE.md             docs/DJI_MQTT_SECURITY.md             docs/EMQX-AUTHZ.md             docs/RC_PRO.md             docs/DRC.md             docs/RTK_NTRIP.md             docs/COMPATIBILITY.md             docs/BETRIEB.md             docs/KONFIGURATION.md             docs/FEHLERSUCHE.md             docs/GLOSSAR.md             docs/RELEASE_STATUS.md             CHANGELOG.md
          do
            test -s "$file" || {
              echo "::error::Pflichtdokument '$file' fehlt oder ist leer."
              exit 1
            }
          done


  hardware-evidence:
    name: DJI Hardware Evidence
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.r1_bootstrap }}
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22.23.2 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Reale DJI-Hardware-Nachweise prüfen
        env:
          FH2_HARDWARE_SCOPE: ${{ inputs.hardware_scope }}
        run: node scripts/hardware-evidence-audit.mjs

      - name: Evidence-Vertrag muss vorhanden sein
        if: always()
        run: test -s docs/HARDWARE_EVIDENCE.md

  draft-analysis:
    name: "Draft #${{ matrix.pr }} · ${{ matrix.label }}"
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.r1_bootstrap && inputs.analyze_drafts) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 44
            ref: agent/msdk-keymanager-contract-v3
            label: MSDK KeyManager
          - pr: 46
            ref: agent/dji-jsbridge-v3
            label: Pilot2 JSBridge
          - pr: 51
            ref: agent/wpml-integration-current-v1
            label: WPML aktuelle Integration
    steps:
      - name: Aktuellen main auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Draft und Branch-Drift erfassen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${{ matrix.ref }}:refs/remotes/origin/${{ matrix.ref }}"
          behind="$(git rev-list --count "origin/${{ matrix.ref }}..origin/main")"
          ahead="$(git rev-list --count "origin/main..origin/${{ matrix.ref }}")"
          merge_base="$(git merge-base origin/main "origin/${{ matrix.ref }}")"
          {
            printf '## Draft #%s – %s\n\n' '${{ matrix.pr }}' '${{ matrix.label }}'
            printf -- '- Branch: %s\n' '${{ matrix.ref }}'
            printf -- '- Ahead gegenüber main: **%s**\n' "$ahead"
            printf -- '- Behind gegenüber main: **%s**\n' "$behind"
            printf -- '- Merge-Base: %s\n' "$merge_base"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ephemeren main+Draft-Stand erzeugen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FH2 Director CI"
          git config user.email "director-ci@users.noreply.github.com"
          git checkout -B "ci-draft-${{ matrix.pr }}" "origin/${{ matrix.ref }}"
          if ! git merge --no-commit --no-ff origin/main; then
            {
              echo
              echo "### Ergebnis"
              echo
              echo "**MERGE_CONFLICT**"
              echo
              echo "Konfliktdateien:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Node.js 22.23.2 und npm 11.19.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: npm 11.19.1 einrichten
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --no-audit --no-fund
          test "$(npm --version)" = "11.19.1"

      - name: Reproduzierbar installieren
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Draft-spezifische Safety-Grenzen prüfen
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main "origin/${{ matrix.ref }}")"
          patch="/tmp/pr-${{ matrix.pr }}.patch"
          git diff "$base..origin/${{ matrix.ref }}" > "$patch"

          case "${{ matrix.pr }}" in
            44)
              node -e '
                const fs = require("fs");
                JSON.parse(fs.readFileSync("docs/contracts/msdk-keymanager-contract.json", "utf8"));
              '
              ;;
            51)
              if git diff "$base..origin/${{ matrix.ref }}" -- apps/control-api/src packages/adapters/dji-cloud/src \
                | grep '^+' \
                | grep -E 'request\.method === "(POST|PUT|PATCH|DELETE)"|wayline_(upload|create|execute|start)|flighttask_(execute|prepare)'; then
                echo "::error::PR #51 verletzt die read-only WPML-/Pilot-Grenze."
                exit 1
              fi
              ;;
            46)
              if git diff "$base..origin/${{ matrix.ref }}" -- .env.example apps/web infra/docker                 | grep '^+'                 | grep -Ei 'VITE_.*(MQTT.*PASSWORD|EMQX.*TOKEN|DRC.*PASSWORD|AUTH_TOKEN)'; then
                echo "::error::PR #46 würde Backend-/MQTT-/DRC-Secrets ins Browser-Bundle verdrahten."
                exit 1
              fi
              ;;
          esac

      - name: Draft-Ergebnis dokumentieren
        if: success()
        run: |
          {
            echo
            echo "### Ergebnis"
            echo
            echo "**MERGE_SIMULATION_BUILD_TEST_PASS**"
            echo
            echo "Hardware-Evidence wird separat im zentralen Hardware-Evidence-Job bewertet."
          } >> "$GITHUB_STEP_SUMMARY"
