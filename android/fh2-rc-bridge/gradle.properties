org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
ANDROID_BUILD_TOOLS_VERSION=35.0.0
DJI_MSDK_VERSION=5.18.0
ANDROIDX_CORE_VERSION=1.17.0
ANDROIDX_APPCOMPAT_VERSION=1.8.0
MAPLIBRE_VERSION=10.3.5
OKHTTP_VERSION=4.12.0

# Optional HTTPS MapLibre style URL. Override in ~/.gradle/gradle.properties
# for a self-hosted/offline tile stack.
FH2_MAP_STYLE_URL=https://demotiles.maplibre.org/style.json

# DJI Developer Center App Key.
# Never commit a real key. Put it in ~/.gradle/gradle.properties:
# AIRCRAFT_API_KEY=...
AIRCRAFT_API_KEY=
