%% ============================================================
%% FH-Clone EMQX authorization rules
%% Top-down / first-match. Production posture: default deny.
%%
%% IMPORTANT:
%% For DJI gateway rules, authentication/provisioning MUST bind the
%% MQTT client ID to the real gateway serial number. The topic template
%% then limits the client to thing/product/{gateway_sn}/... and
%% sys/product/{gateway_sn}/...
%% ============================================================

%% ------------------------------------------------------------
%% 1. Optional browser MQTT account: READ ONLY
%% ------------------------------------------------------------
{allow, {username, "webui-operator"}, subscribe,
  ["thing/product/+/osd",
   "thing/product/+/state",
   "thing/product/+/events",
   "thing/product/+/services_reply",
   "thing/product/+/drc/up",
   "sys/product/+/status"]}.

{deny, {username, "webui-operator"}, publish,
  ["thing/product/#",
   "sys/product/#"]}.

%% ------------------------------------------------------------
%% 2. FH-Clone backend service
%% ------------------------------------------------------------
{allow, {username, "backend-service"}, subscribe,
  ["thing/product/+/osd",
   "thing/product/+/state",
   "thing/product/+/events",
   "thing/product/+/requests",
   "thing/product/+/services_reply",
   "thing/product/+/drc/up",
   "sys/product/+/status"]}.

{allow, {username, "backend-service"}, publish,
  ["thing/product/+/services",
   "thing/product/+/property/set",
   "thing/product/+/events_reply",
   "thing/product/+/requests_reply",
   "thing/product/+/drc/down",
   "sys/product/+/status_reply"]}.

%% ------------------------------------------------------------
%% 3. DJI gateway / Pilot / Dock client
%%
%% Provisioning contract:
%%   clientid == gateway_sn
%%   username matches ^dji-gateway-[A-Za-z0-9_-]+$
%% Authentication must issue these credentials only to the bound device.
%% ------------------------------------------------------------
{allow,
  {'and',
    [{username, {re, "^dji-gateway-[A-Za-z0-9_-]+$"}},
     {clientid, {re, "^[A-Za-z0-9_-]+$"}}]},
  publish,
  ["thing/product/${clientid}/osd",
   "thing/product/${clientid}/state",
   "thing/product/${clientid}/events",
   "thing/product/${clientid}/requests",
   "thing/product/${clientid}/services_reply",
   "thing/product/${clientid}/drc/up",
   "sys/product/${clientid}/status"]}.

{allow,
  {'and',
    [{username, {re, "^dji-gateway-[A-Za-z0-9_-]+$"}},
     {clientid, {re, "^[A-Za-z0-9_-]+$"}}]},
  subscribe,
  ["thing/product/${clientid}/services",
   "thing/product/${clientid}/property/set",
   "thing/product/${clientid}/events_reply",
   "thing/product/${clientid}/requests_reply",
   "thing/product/${clientid}/drc/down",
   "sys/product/${clientid}/status_reply"]}.

%% ------------------------------------------------------------
%% 4. Read-only operations dashboard
%% ------------------------------------------------------------
{allow, {username, "dashboard"}, subscribe,
  ["$SYS/#",
   "thing/product/#",
   "sys/product/#"]}.

{deny, {username, "dashboard"}, publish,
  ["$SYS/#",
   "thing/product/#",
   "sys/product/#"]}.

%% ------------------------------------------------------------
%% 5. Generic protection rules
%% ------------------------------------------------------------
{deny, all, subscribe,
  ["$SYS/#",
   {eq, "#"},
   {eq, "+/#"}]}.

{deny, all}.
