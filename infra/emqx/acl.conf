%% ============================================================
%% FH-Clone static EMQX authorization fallback
%%
%% DJI gateway authorization is dynamic and handled by the HTTP
%% authorizer before this file. This file handles trusted FH-Clone
%% service identities and is the final deny-by-default guard.
%% ============================================================

%% ------------------------------------------------------------
%% 1. Optional browser MQTT account: READ ONLY
%% ------------------------------------------------------------
{allow, {username, "webui-operator"}, subscribe,
  ["thing/product/+/osd",
   "thing/product/+/state",
   "thing/product/+/events",
   "thing/product/+/services_reply",
   "thing/product/+/drc/up",
   "sys/product/+/status"]}.

{deny, {username, "webui-operator"}, publish,
  ["thing/product/#",
   "sys/product/#"]}.

%% ------------------------------------------------------------
%% 2. FH-Clone backend service
%% ------------------------------------------------------------
{allow, {username, "backend-service"}, subscribe,
  ["thing/product/+/osd",
   "thing/product/+/state",
   "thing/product/+/events",
   "thing/product/+/requests",
   "thing/product/+/services_reply",
   "thing/product/+/drc/up",
   "sys/product/+/status"]}.

{allow, {username, "backend-service"}, publish,
  ["thing/product/+/services",
   "thing/product/+/property/set",
   "thing/product/+/events_reply",
   "thing/product/+/requests_reply",
   "thing/product/+/drc/down",
   "sys/product/+/status_reply"]}.

%% ------------------------------------------------------------
%% 3. Read-only operations dashboard
%% ------------------------------------------------------------
{allow, {username, "dashboard"}, subscribe,
  ["$SYS/#",
   "thing/product/#",
   "sys/product/#"]}.

{deny, {username, "dashboard"}, publish,
  ["$SYS/#",
   "thing/product/#",
   "sys/product/#"]}.

%% ------------------------------------------------------------
%% 4. DJI gateway accounts must never fall through to a broad rule.
%% Normal gateway permissions are decided by the preceding HTTP authorizer.
%% ------------------------------------------------------------
{deny, {username, {re, "^dji-gateway-.+$"}}, all,
  ["thing/product/#",
   "sys/product/#",
   "$SYS/#"]}.

%% ------------------------------------------------------------
%% 5. Generic protection rules
%% ------------------------------------------------------------
{deny, all, subscribe,
  ["$SYS/#",
   {eq, "#"},
   {eq, "+/#"}]}.

{deny, all}.
