services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: fhclone-timescaledb
    environment:
      POSTGRES_DB: fhclone
      POSTGRES_USER: fhclone
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhclone -d fhclone"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  timescale_data:
