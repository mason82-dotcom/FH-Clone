services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: fhclone-timescaledb
    environment:
      POSTGRES_DB: fhclone
      POSTGRES_USER: fhclone
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_rtk_fix_enum.sql:/docker-entrypoint-initdb.d/002_rtk_fix_enum.sql:ro
      - ./sql/003_authz_audit.sql:/docker-entrypoint-initdb.d/003_authz_audit.sql:ro
      - ./sql/004_gateway_credentials.sql:/docker-entrypoint-initdb.d/004_gateway_credentials.sql:ro
      - ../postgres/migrations/001_dji_gateway_registry.sql:/docker-entrypoint-initdb.d/005_dji_gateway_registry.sql:ro
      - ./sql/005_msdk_token_revocations.sql:/docker-entrypoint-initdb.d/006_msdk_token_revocations.sql:ro
      - ./sql/006_media_assets.sql:/docker-entrypoint-initdb.d/007_media_assets.sql:ro
      - ./sql/007_telemetry_history.sql:/docker-entrypoint-initdb.d/008_telemetry_history.sql:ro
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fhclone -d fhclone >/dev/null && psql -U fhclone -d fhclone -tAc \"SELECT CASE WHEN to_regclass('public.missions') IS NOT NULL AND to_regclass('public.telemetry') IS NOT NULL AND to_regclass('public.authz_audit') IS NOT NULL AND to_regclass('public.gateway_credentials') IS NOT NULL AND to_regclass('public.dji_gateways') IS NOT NULL AND to_regclass('public.dji_gateway_devices') IS NOT NULL AND to_regclass('public.msdk_token_revocations') IS NOT NULL THEN 1 ELSE 0 END\" | grep -qx 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-migrations:
    image: timescale/timescaledb:2.30.1-pg16
    environment:
      PGPASSWORD: ${TIMESCALE_PASSWORD}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./sql/006_media_assets.sql:/migrations/006_media_assets.sql:ro
      - ./sql/007_telemetry_history.sql:/migrations/007_telemetry_history.sql:ro
    command:
      [
        "psql",
        "-h",
        "timescaledb",
        "-U",
        "fhclone",
        "-d",
        "fhclone",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/migrations/006_media_assets.sql",
        "-f",
        "/migrations/007_telemetry_history.sql"
      ]
    restart: "no"

volumes:
  timescale_data:
