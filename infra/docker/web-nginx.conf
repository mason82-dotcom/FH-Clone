server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    proxy_pass http://control-api:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /ready {
    proxy_pass http://control-api:8080/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://control-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # DJI Pilot 2 calls the Pilot-to-Cloud Wayline API on the same origin as
  # the bootstrap page. The backend route is read-only and separately
  # authenticated with x-auth-token.
  location /wayline/ {
    proxy_pass http://control-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
