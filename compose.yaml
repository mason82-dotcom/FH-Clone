name: fh2-v3

services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16
    environment:
      POSTGRES_DB: fhclone
      POSTGRES_USER: fhclone
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD fehlt}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescale/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./infra/timescale/sql/002_rtk_fix_enum.sql:/docker-entrypoint-initdb.d/002_rtk_fix_enum.sql:ro
      - ./infra/timescale/sql/003_authz_audit.sql:/docker-entrypoint-initdb.d/003_authz_audit.sql:ro
      - ./infra/timescale/sql/004_gateway_credentials.sql:/docker-entrypoint-initdb.d/004_gateway_credentials.sql:ro
      - ./infra/postgres/migrations/001_dji_gateway_registry.sql:/docker-entrypoint-initdb.d/005_dji_gateway_registry.sql:ro
      - ./infra/timescale/sql/005_msdk_token_revocations.sql:/docker-entrypoint-initdb.d/006_msdk_token_revocations.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fhclone -d fhclone >/dev/null && psql -U fhclone -d fhclone -tAc \"SELECT CASE WHEN to_regclass('public.missions') IS NOT NULL AND to_regclass('public.telemetry') IS NOT NULL AND to_regclass('public.authz_audit') IS NOT NULL AND to_regclass('public.gateway_credentials') IS NOT NULL AND to_regclass('public.dji_gateways') IS NOT NULL AND to_regclass('public.dji_gateway_devices') IS NOT NULL AND to_regclass('public.msdk_token_revocations') IS NOT NULL THEN 1 ELSE 0 END\" | grep -qx 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  control-api:
    build:
      context: .
      dockerfile: infra/docker/control-api.Dockerfile
    environment:
      BIND: 0.0.0.0
      PORT: 8080
      INTERNAL_BIND: 0.0.0.0
      INTERNAL_PORT: 8081

      DATABASE_URL: postgresql://fhclone:${TIMESCALE_PASSWORD}@timescaledb:5432/fhclone
      TIMESCALE_URL: postgresql://fhclone:${TIMESCALE_PASSWORD}@timescaledb:5432/fhclone

      DJI_MQTT_URL: mqtt://emqx:1883
      DJI_MQTT_USERNAME: backend-service
      DJI_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD fehlt}
      DJI_MQTT_CLIENT_ID: fh-clone-backend
      DJI_CLOUD_API_VERSION: ${DJI_CLOUD_API_VERSION:-}

      # FlightHub 2 OpenAPI V2 bleibt optional und ausschließlich read-only.
      FH2_ENABLED: ${FH2_ENABLED:-false}
      FH2_BASE_URL: ${FH2_BASE_URL:-}
      FH2_ORG_ID: ${FH2_ORG_ID:-}
      FH2_PROJECT_ID: ${FH2_PROJECT_ID:-}
      FH2_USER_TOKEN: ${FH2_USER_TOKEN:-}
      FH2_TIMEOUT_MS: ${FH2_TIMEOUT_MS:-15000}

      EMQX_AUTHN_TOKEN: ${EMQX_AUTHN_TOKEN:?EMQX_AUTHN_TOKEN fehlt}
      EMQX_AUTHZ_TOKEN: ${EMQX_AUTHZ_TOKEN:?EMQX_AUTHZ_TOKEN fehlt}

      RTK_SOURCE_LABEL: ${RTK_SOURCE_LABEL:-}
      RTK_SOURCE_PROVIDER: ${RTK_SOURCE_PROVIDER:-}
      LOG_RAW_DJI: ${LOG_RAW_DJI:-0}

      UGCS_BRIDGE_URL: ${UGCS_BRIDGE_URL:-}
      UGCS_BRIDGE_TIMEOUT_MS: ${UGCS_BRIDGE_TIMEOUT_MS:-5000}
      MEDIA_INGEST_TOKEN: ${MEDIA_INGEST_TOKEN:-}

      # Native Android/MSDK bridge. Ohne beide Secrets bleibt der Pfad aus.
      MSDK_PAIRING_TOKEN: ${MSDK_PAIRING_TOKEN:-}
      MSDK_BRIDGE_TOKEN_SECRET: ${MSDK_BRIDGE_TOKEN_SECRET:-}
      MSDK_BRIDGE_TOKEN_TTL_SECONDS: ${MSDK_BRIDGE_TOKEN_TTL_SECONDS:-86400}
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    ports:
      - "${FH2_API_BIND:-0.0.0.0}:${FH2_API_PORT:-8080}:8080"
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - frontend
      - backend

  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.7.2}
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?EMQX_NODE_COOKIE fehlt}
      EMQX_NODE__DATA_DIR: /opt/emqx/data
      EMQX_AUTHENTICATION__1: >-
        {"mechanism":"password_based","backend":"http","enable":true,"method":"post","url":"http://control-api:8081/internal/emqx/authn","headers":{"Content-Type":"application/json","Authorization":"Bearer ${EMQX_AUTHN_TOKEN:?EMQX_AUTHN_TOKEN fehlt}"},"body":{"username":"$${username}","password":"$${password}","clientid":"$${clientid}","peerhost":"$${peerhost}"},"pool_size":8,"connect_timeout":"1s","request_timeout":"1s"}
      EMQX_AUTHORIZATION__SOURCES__1: >-
        {"type":"http","enable":true,"method":"post","url":"http://control-api:8081/internal/emqx/authz","headers":{"Content-Type":"application/json","Authorization":"Bearer ${EMQX_AUTHZ_TOKEN:?EMQX_AUTHZ_TOKEN fehlt}"},"body":{"username":"$${username}","clientid":"$${clientid}","peerhost":"$${peerhost}","role":"$${client_attrs.role}","gateway_sn":"$${client_attrs.gateway_sn}","action":"$${action}","topic":"$${topic}","qos":"$${qos}"},"pool_size":8,"request_timeout":"1s"}
    volumes:
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/fh-clone-acl.conf:ro
      - emqx_data:/opt/emqx/data
    ports:
      - "${MQTT_BIND:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "/opt/emqx/bin/emqx ctl status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - backend
      - mqtt_edge

  ugcs-bridge:
    profiles: ["ugcs"]
    build:
      context: ./services/ugcs-bridge
      dockerfile: Dockerfile
    environment:
      UGCS_HOST: ${UGCS_HOST:-host.docker.internal}
      UGCS_PORT: ${UGCS_PORT:-3334}
      UGCS_USER: ${UGCS_USER:-}
      UGCS_PASSWORD: ${UGCS_PASSWORD:-}
      BRIDGE_BIND: 0.0.0.0
      BRIDGE_PORT: 8092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8092"
    restart: unless-stopped
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_FH2_STANDALONE_ENABLED: "${VITE_FH2_STANDALONE_ENABLED:-false}"
        VITE_FH2_NATIVE_COCKPIT_ENABLED: "${VITE_FH2_NATIVE_COCKPIT_ENABLED:-false}"
        VITE_FH2_HOST_URL: "${VITE_FH2_HOST_URL:-}"
        VITE_FH2_SERVER_URL: "${VITE_FH2_SERVER_URL:-}"
        VITE_FH2_WSS_URL: "${VITE_FH2_WSS_URL:-}"
        VITE_FH2_PROJECT_ID: "${VITE_FH2_PROJECT_ID:-}"
        VITE_FH2_PROJECT_TOKEN: "${VITE_FH2_PROJECT_TOKEN:-}"
        VITE_FH2_PAAS_URL: "${VITE_FH2_PAAS_URL:-}"
        VITE_FH2_COCKPIT_PROP_STYLE: "${VITE_FH2_COCKPIT_PROP_STYLE:-camel}"
        VITE_FH2_GATEWAY_SN: "${VITE_FH2_GATEWAY_SN:-}"
        VITE_FH2_DRONE_SN: "${VITE_FH2_DRONE_SN:-}"
        VITE_FH2_WAYLINE_ID: "${VITE_FH2_WAYLINE_ID:-}"
        VITE_FH2_FLIGHT_PATH_ID: "${VITE_FH2_FLIGHT_PATH_ID:-}"
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "${FH2_WEB_BIND:-0.0.0.0}:${FH2_WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - frontend

volumes:
  timescale_data:
  emqx_data:

networks:
  frontend:
  backend:
    internal: true
  mqtt_edge:
